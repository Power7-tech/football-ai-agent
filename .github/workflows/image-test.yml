name: Image Test

on:
  push:
    branches:
      - main

jobs:
  test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Check Python
        run: python --version

      - name: Check test file
        run: |
          ls -la
          test -f test_image.py

      - name: Test image generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python test_image.py
