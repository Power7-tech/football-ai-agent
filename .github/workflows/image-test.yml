name: Image Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python test
        run: python --version

      - name: Install Gemini
        run: pip install google-genai

      - name: Check test file
        run: |
          ls -la
          test -f test_image.py
          echo "test_image.py FOUND"
